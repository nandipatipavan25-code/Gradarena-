<head>
  <style>
    body { margin: 0; padding: 40px; display: flex; gap: 30px; font-family: 'Inter', sans-serif; background: #0f172a; }
    .box { background: #151827; width: 250px; padding: 16px; border-radius: 12px; border: 1px solid #1e2235; color: white; }
  </style>
</head>
<body>
  <!-- Option 1: Full Logo SVG + AI badge -->
  <div class="box">
    <div style="font-size: 11px; color: #8994a7; margin-bottom: 8px;">Option 1: Full SVG + Badges</div>
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e2235; padding-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="Grad Arena Logo-01.svg" style="height: 38px; width: auto;" />
        <div>
          <span style="background: rgba(16,122,204,0.2); color: #38bdf8; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(16,122,204,0.4);">AI</span>
          <div style="color: #8994a7; font-size: 10px; margin-top: 2px;">Intelligence</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Option 2: Full Logo SVG clean with Hiring Intelligence below -->
  <div class="box">
    <div style="font-size: 11px; color: #8994a7; margin-bottom: 8px;">Option 2: Standalone Full SVG + AI Pill</div>
    <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e2235; padding-bottom: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <img src="Grad Arena Logo-01.svg" style="height: 32px; width: auto;" />
          <span style="background: rgba(16,122,204,0.2); color: #38bdf8; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; border: 1px solid rgba(16,122,204,0.4); font-family: monospace;">AI</span>
        </div>
        <div style="color: #8994a7; font-size: 10px; padding-left: 2px; font-family: monospace;">Hiring Intelligence</div>
      </div>
    </div>
  </div>
