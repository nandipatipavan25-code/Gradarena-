<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 40px; display: flex; gap: 40px; font-family: sans-serif; background: #e2e8f0; }
    .dark-box { background: #151827; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 300px; }
    .light-box { background: #ffffff; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 300px; }
  </style>
</head>
<body>
  <div class="dark-box">
    <div style="color: white; font-size: 12px;">Dark Sidebar (#151827) with SVG Logo:</div>
    <!-- Direct SVG Image -->
    <img src="Grad Arena Logo-01.svg" style="height: 50px; width: auto;" />
    
    <!-- In Header row -->
    <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
      <img src="Grad Arena Logo-01.svg" style="height: 38px; width: auto;" />
      <div>
        <div style="color: white; font-weight: bold; font-size: 13px;">GradArena <span style="background: rgba(16,122,204,0.2); color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(16,122,204,0.4);">AI</span></div>
        <div style="color: #8994a7; font-size: 11px;">Hiring Intelligence</div>
      </div>
    </div>
  </div>

  <div class="light-box">
    <div style="color: #172033; font-size: 12px;">Light Workspace (#FFFFFF):</div>
    <img src="Grad Arena Logo-01.svg" style="height: 50px; width: auto;" />
    <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
      <img src="Grad Arena Logo-01.svg" style="height: 38px; width: auto;" />
      <div>
        <div style="color: #172033; font-weight: bold; font-size: 13px;">GradArena <span style="background: rgba(16,122,204,0.1); color: #107acc; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(16,122,204,0.3);">AI</span></div>
        <div style="color: #64748b; font-size: 11px;">Hiring Intelligence</div>
      </div>
    </div>
  </div>
</body>
</html>
